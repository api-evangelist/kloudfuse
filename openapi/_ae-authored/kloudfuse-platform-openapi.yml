components:
  securitySchemes:
    ServiceAccountToken:
      type: http
      scheme: bearer
      description: Kloudfuse Service Account token
    IngestApiKey:
      type: apiKey
      in: header
      name: Kf-Api-Key
  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          enum:
          - error
        errorType:
          type: string
          enum:
          - BAD_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - RESOURCE_EXHAUSTED
          - RATE_LIMITED
          - CANCELED
          - INTERNAL_ERROR
          - SERVICE_UNAVAILABLE
          - TIMEOUT
        error:
          type: string
