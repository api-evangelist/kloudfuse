openapi: 3.2.0
info:
  title: Kloudfuse Platform GraphQL API
  version: latest
  description: Generated by API Evangelist from the Kloudfuse API reference documentation (docs.kloudfuse.com/platform/latest/reference/api/). NOT published by Kloudfuse. Paths and methods come from the documented curl examples; request and response bodies are not modelled. Kloudfuse is deployed per customer, so the server host is the customer instance.
  x-generated-from: documentation
  x-ae-authored: true
  x-source: https://docs.kloudfuse.com/platform/latest/reference/api/
servers:
- url: https://{instance}
  variables:
    instance:
      default: your-instance.example.com
      description: Your Kloudfuse instance hostname
security:
- ServiceAccountToken: []
tags:
- name: Graph QL
paths:
  /query:
    post:
      tags:
      - Graph QL
      summary: Execute GraphQL Operation
      operationId: executeGraphqlOperation
      description: Execute GraphQL Operation. Documented at https://docs.kloudfuse.com/platform/latest/reference/api/graphql/
      externalDocs:
        url: https://docs.kloudfuse.com/platform/latest/reference/api/graphql/
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
components:
  responses:
    Error:
      description: Error (see API Response Codes)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          enum:
          - error
        errorType:
          type: string
          enum:
          - BAD_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - RESOURCE_EXHAUSTED
          - RATE_LIMITED
          - CANCELED
          - INTERNAL_ERROR
          - SERVICE_UNAVAILABLE
          - TIMEOUT
        error:
          type: string
        request_id:
          type: string
  securitySchemes:
    ServiceAccountToken:
      type: http
      scheme: bearer
      description: Kloudfuse Service Account token
    IngestApiKey:
      type: apiKey
      in: header
      name: Kf-Api-Key
