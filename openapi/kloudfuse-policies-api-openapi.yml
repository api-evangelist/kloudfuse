components:
  responses:
    Error:
      description: Error (see API Response Codes)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          enum:
          - error
        errorType:
          type: string
          enum:
          - BAD_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - RESOURCE_EXHAUSTED
          - RATE_LIMITED
          - CANCELED
          - INTERNAL_ERROR
          - SERVICE_UNAVAILABLE
          - TIMEOUT
        error:
          type: string
        request_id:
          type: string
  securitySchemes:
    ServiceAccountToken:
      type: http
      scheme: bearer
      description: Kloudfuse Service Account token
    IngestApiKey:
      type: apiKey
      in: header
