aid: kloudfuse
name: Kloudfuse
description: Kloudfuse is a unified observability platform that consolidates metrics, logs, traces, events, real user monitoring and continuous profiling into a single data lake deployed in the customer's
  own cloud (VPC). It exposes Prometheus-, Loki- and Tempo-compatible query APIs, a GraphQL query transport, RBAC policy and team REST APIs, an OTLP/Prometheus remote-write ingester, a hydration API for
  archived data, and an MCP server for AI assistants.
